name: CI

# push on all branches already covers same-repo PRs; a pull_request
# trigger would just run everything twice on a solo repo.
on:
  push:
    branches: ["**"]
  # Manual trigger. Added because a GitHub Actions outage swallowed the
  # pushes that configured this project: once Actions recovers it does not
  # retroactively run commits pushed while it was down, and without this
  # the only way to get a run on an existing commit is to push a throwaway
  # empty one. `gh workflow run ci.yml --ref main` covers it instead.
  workflow_dispatch:

jobs:
  test:
    # windows-latest, not ubuntu: this project ships no container and its
    # only runtime is a Windows CLI. Testing on Linux would test a platform
    # nothing ever runs on -- path handling and the ExifTool integration are
    # exactly where a cross-platform difference would hide.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # Pinned to the minor version, not "3.x". The dependency set is
          # pinned to cp314 wheels; letting the runner drift to a newer
          # Python would silently fall back to source builds or fail.
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Lint
        run: python -m ruff check .

      - name: Run tier-1 tests
        # Tier 1 only: no real photos, no ExifTool, no source archive.
        # Higher tiers are documented in CLAUDE.md and run locally, because
        # tiers 3 and 4 need the personal corpus, which never leaves the
        # machine.
        run: python -m pytest
