name: CI

# push on all branches already covers same-repo PRs; a pull_request
# trigger would just run everything twice on a solo repo.
on:
  push:
    branches: ["**"]
  # Manual trigger. Added because a GitHub Actions outage swallowed the
  # pushes that configured this project: once Actions recovers it does not
  # retroactively run commits pushed while it was down, and without this
  # the only way to get a run on an existing commit is to push a throwaway
  # empty one. `gh workflow run ci.yml --ref main` covers it instead.
  workflow_dispatch:

jobs:
  test:
    # A matrix, not windows-latest alone: the CLI is claimed to run on
    # macOS and Linux too, and until this matrix existed that claim was
    # untested -- nothing ever ran it there. Path handling and the ExifTool
    # integration are exactly where a difference between platforms would
    # hide, so those are exactly what this earns its keep by exercising.
    # `fail-fast: false` so one OS's failure does not hide what the other
    # two would have said.
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # Pinned to the minor version, not "3.x". The dependency set is
          # pinned to cp314 wheels; letting the runner drift to a newer
          # Python would silently fall back to source builds or fail.
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      # The tier-2 tests that prove the write/read-back chain need ExifTool,
      # and none of these runner images ship it. Without an install step
      # those tests skip and the suite still reports green -- which is how
      # the project's "validate with a different tool than the one that
      # wrote" rule ended up advertised as tested while running nowhere.
      # Split per-OS because there is no one install command that works on
      # all three; each `if:` picks the one leg it applies to, so a runner
      # never falls through and silently skips the install.
      #
      # Deliberately unpinned, unlike everything in requirements.txt. The
      # pinned ExifTool is the one on the conversion machine; this copy
      # only has to prove the round-trip still works, so tracking upstream
      # makes it an early warning rather than a correctness risk.
      - name: Install ExifTool (Windows)
        if: runner.os == 'Windows'
        run: choco install exiftool -y --no-progress

      - name: Install ExifTool (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libimage-exiftool-perl

      - name: Install ExifTool (macOS)
        if: runner.os == 'macOS'
        run: brew install exiftool

      - name: Install inih, which pyexiv2's macOS wheel needs and does not carry
        if: runner.os == 'macOS'
        # `pyexiv2` is the *third* parser -- ExifTool writes, Pillow reads
        # back, exiv2 re-reads with its own -- and it is what makes the
        # "validate with a different tool than the one that wrote" rule real
        # rather than advertised. Its macOS wheel bundles `libexiv2.dylib`
        # but leaves that dylib dynamically linked against Homebrew's inih
        # (`libINIReader.0.dylib`), which no runner image ships. The result
        # is an `OSError` at *import*, so `test_fixtures_output.py` fails to
        # collect and the entire tier-2 tag round trip does not run.
        #
        # Installed rather than worked around. Skipping `pyexiv2` on macOS
        # would turn this leg green having dropped the coverage the step
        # above exists to protect -- the same failure mode one dependency
        # over, and the one this project has already shipped once.
        #
        # The version check is the point of the second line. `0` is an ABI
        # soname, not the formula version, so a future inih could ship
        # `libINIReader.1.dylib` and leave us back at a dlopen failure
        # thirty lines into a pytest traceback. This says so here instead.
        run: |
          brew install inih
          lib="$(brew --prefix inih)/lib/libINIReader.0.dylib"
          if [ ! -f "$lib" ]; then
            echo "::error::inih no longer provides libINIReader.0.dylib, which is what pyexiv2's bundled libexiv2 links against. Contents of $(brew --prefix inih)/lib below; update this step to the new soname."
            ls -la "$(brew --prefix inih)/lib" || true
            exit 1
          fi

      - name: Lint
        run: python -m ruff check .

      - name: Run tests
        # Tiers 1 and 2. Tier 2 uses the committed fixtures, every one of
        # which was confirmed person-free by eye -- see
        # tests/fixtures/LICENSE.md for what they are and who made them.
        # Tiers 3 and 4 need the personal corpus and never run here.
        #
        # FPX_REQUIRE_EXIFTOOL turns "ExifTool is missing" from a skip into
        # a failure. If the install step above ever silently stops working,
        # this is what refuses to let the suite go green without the
        # coverage it claims.
        env:
          FPX_REQUIRE_EXIFTOOL: "1"
        run: python -m pytest

  # Without this the 16 tests in tests/test_gui_window.py `importorskip` in
  # every job we run, which is not coverage -- it is a green tick over code
  # nothing executed. Separate from the main job so the CLI keeps being tested
  # in an environment that has no GUI toolkit in it, which is how most people
  # will run it.
  gui:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-gui.txt

      - name: Install ExifTool
        run: choco install exiftool -y --no-progress

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-gui.txt -r requirements-dev.txt

      - name: Run the suite with the desktop front end present
        env:
          # No display on a runner. The widget tests are written for it.
          QT_QPA_PLATFORM: offscreen
          FPX_REQUIRE_EXIFTOOL: "1"
        run: python -m pytest

  # The guard the working-tree ones were not. `test_environment.py` has two
  # leakage checks and both list `git ls-files --cached --others`: the tree as
  # it is now. Neither has ever read history, which is how a child's name and
  # two album names sat in five commits across five releases with every check
  # green. Deleting a file does not remove it from a clone.
  #
  # Runs on ubuntu because it is git and Python and nothing else. The rest of
  # this workflow is on Windows because the product is a Windows tool; a
  # history scan is not the product.
  history:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The whole point of the job, and the easiest thing to get wrong:
          # actions/checkout fetches ONE commit by default, and a history scan
          # over one commit passes by having looked at nothing.
          # `history_leak_guard.py` refuses a shallow clone rather than
          # calling it clean, so removing this line fails loudly instead of
          # going quietly green -- but it should not be removed.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Scan all reachable history for personal content
        # Where the needles live, and why not in the repository: a guard whose
        # source contains the strings it guards is itself the leak. So the
        # literal needles come from a repository SECRET, the guard prints a
        # digest rather than the needle when it hits (CI logs on a public repo
        # are public), and the file-shape layer -- photographs, sidecars, run
        # output -- is committed because it is structural and contains nothing
        # personal.
        #
        # Deliberately NOT --require-needles: an unset secret leaves the shape
        # layer running, which is the half a fork needs most. See the module
        # docstring in the guard.
        env:
          FPX_LEAK_NEEDLES: ${{ secrets.FPX_LEAK_NEEDLES }}
        run: python scripts/history_leak_guard.py --repo .
