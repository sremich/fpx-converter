name: Release

# CI owns releases end to end. A human (or agent) only pushes a vX.Y.Z tag;
# this workflow verifies, tests, and creates the GitHub release. If any step
# fails, no partial release exists. Never create releases or edit tags by
# hand.
#
# This project publishes NO container image. The scaffold's GHCR build/push
# job was removed at milestone 0 rather than left as a dead stub. The one
# artifact it does attach is the PyInstaller exe, added at 1.1.0 when the exe
# existed.
#
# Order matters: verify -> package -> release. The exe is built and actually
# exercised before the release is created, so a failed build means no release
# rather than a published release with nothing in it.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  # Needed for actions/attest-build-provenance below: it mints a Sigstore
  # signature (id-token) and records it against the repo (attestations), so
  # the exe someone downloads can be tied back to this exact workflow run
  # rather than trusted on the strength of a filename alone.
  id-token: write
  attestations: write

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history, for the leakage scan below. The default checkout is
          # one commit, and a history scan over one commit passes by having
          # looked at nothing -- the guard refuses a shallow clone rather than
          # reporting that as clean.
          fetch-depth: 0

      - name: Tag must match VERSION (and be X.Y.Z)
        shell: bash
        run: bash scripts/check-version.sh "${GITHUB_REF_NAME}"

      - name: Refuse to release an unconfigured scaffold
        shell: bash
        run: |
          # Fail if any milestone-0 TODO marker is still present anywhere.
          # The needle is assembled at runtime so this file never matches itself.
          M="TODO(milestone"; M="${M}-0)"
          if grep -rn --fixed-strings "$M" --exclude-dir=.git .; then
            echo "::error::Scaffold TODO markers remain — finish milestone 0 before releasing."
            exit 1
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Scan all reachable history for personal content
        # The same guard ci.yml runs, and here for the same reason the
        # ExifTool step below gives: a release gate must not be weaker than
        # the push gate. Publishing is the moment history stops being
        # recoverable, because a tag cannot be un-downloaded.
        #
        # The literal needles come from a repository SECRET, never from a file
        # in the repository -- a guard whose source contains the strings it
        # guards is itself the leak -- and a hit is reported as a digest, since
        # these logs are public.
        env:
          FPX_LEAK_NEEDLES: ${{ secrets.FPX_LEAK_NEEDLES }}
        shell: bash
        run: python scripts/history_leak_guard.py --repo .

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Install ExifTool
        # Same reason as ci.yml: the tier-2 tests need it and GitHub's Windows
        # runners do not ship it. The shipped read-back is Pillow's -- pyexiv2
        # is GPL-3.0 and cannot be imported from the package -- and the tier-2
        # tests add exiv2's own parser as a third opinion at test time. Both
        # halves need something to have written the tags first. A release gate
        # must not be weaker than the push gate.
        run: choco install exiftool -y --no-progress

      - name: Lint
        run: python -m ruff check .

      - name: Run tests
        # Unlike ci.yml, a release with failing tests MUST fail.
        # FPX_REQUIRE_EXIFTOOL makes a missing ExifTool a failure rather than
        # a skip, so a release can never be cut on a suite that quietly
        # dropped the metadata round-trip.
        env:
          FPX_REQUIRE_EXIFTOOL: "1"
        run: python -m pytest

  release:
    # `package` too: the release is created only once there is an executable
    # to put in it.
    needs: [verify, package]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: fpx-converter-exe
          path: dist

      - name: Create GitHub release (pre-release while 0.x)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PRERELEASE=""
          case "${GITHUB_REF_NAME#v}" in 0.*) PRERELEASE="--prerelease";; esac
          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes \
            $PRERELEASE \
            dist/fpx-converter-*.exe \
            dist/fpx-converter-*.exe.sha256
          echo "Release created. REMINDER: tick the /release skill's checklist."

  # The exe is the whole point of 1.1.0: somebody who does not use a terminal
  # cannot be asked to install Python first. Runs after `verify` so a failing
  # suite blocks the artifact too, and after `release` so there is something
  # to attach it to. Windows-only by nature -- PyInstaller does not
  # cross-compile.
  package:
    # Before `release`, deliberately. This job used to run after it, so a
    # failed build left a published release with no executable in it -- and
    # the same version cannot be re-tagged to fix that. If the exe cannot be
    # built, no release should exist at all.
    needs: verify
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-gui.txt

      - name: Install ExifTool
        # The smoke test below converts real fixtures, which needs it.
        run: choco install exiftool -y --no-progress

      - name: Install dependencies
        # requirements-gui.txt starts with `-r requirements.txt` and carries
        # the pinned PyInstaller, so there is no separate install and no
        # floating version. PySide6 is deliberately absent from
        # requirements.txt: the CLI does not need a GUI toolkit to run.
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-gui.txt

      - name: Build the standalone executable
        run: python -m PyInstaller --noconfirm packaging/fpx-converter.spec

      - name: Name the built file once, for every step after this
        # The spec names the exe for the version in `VERSION`. Resolved here
        # rather than repeated, so no step can end up looking for a file the
        # build never made.
        shell: bash
        run: echo "EXE=dist/fpx-converter-$(cat VERSION).exe" >> "$GITHUB_ENV"

      - name: The build must produce the file it is named for
        shell: bash
        run: test -f "$EXE" || { ls -la dist; echo "::error::$EXE not built"; exit 1; }

      - name: The bundle must carry VERSION
        # `unknown` here means VERSION did not make it into the bundle, which
        # would ship an exe that cannot say what it is.
        shell: bash
        run: |
          printed="$("$EXE" --run-cli --version)"
          echo "$printed"
          case "$printed" in
            *unknown*) echo "::error::VERSION is not in the bundle"; exit 1;;
          esac
          grep -qF "$(cat VERSION)" <<<"$printed"

      - name: The bundle must actually convert
        # The check that matters. `--version` proves the process starts; it
        # cannot see a missing Pillow plugin, an ExifTool that is not on PATH,
        # or a data file the spec forgot to collect. A real conversion can.
        # Two fixtures is enough to exercise decode, both writers and the
        # ExifTool round trip. (pyexiv2 is deliberately not in the bundle at
        # all -- it is GPL-3.0 -- which is what the licence step below
        # verifies independently.)
        env:
          FPX_REQUIRE_EXIFTOOL: "1"
        shell: bash
        run: |
          "$EXE" --run-cli scan \
            --source tests/fixtures --manifest smoke/m.json
          "$EXE" --run-cli convert \
            --manifest smoke/m.json --store tests/fixtures \
            --dest smoke/out --limit 2
          test -f smoke/out/audit_report.json

          # And that the bundle honours the naming and folder patterns, which
          # are new modules reached through new flags. A packaging problem in
          # either would not fail the run -- it would quietly put the files
          # somewhere other than where they were asked for.
          "$EXE" --run-cli convert \
            --manifest smoke/m.json --store tests/fixtures \
            --dest smoke/named --limit 1 --no-sharing \
            --folder-scheme flat --name-template '{name}'
          found="$(find smoke/named/archive -name '*.tif')"
          test "$(echo "$found" | wc -l)" -eq 1
          case "$found" in
            smoke/named/archive/*/*)
              echo "flat scheme still made a subfolder: $found" >&2; exit 1;;
          esac
          case "$(basename "$found")" in
            [0-9][0-9][0-9][0-9]-*)
              echo "a date prefix survived a pattern that never asked for one: $found" >&2
              exit 1;;
          esac

      - name: The published exe must contain no GPL code
        # Defence in depth over `packaging/licence_guard.py`, which raises
        # `LicenceLeak` during the build if pyexiv2 or `exiv2.dll` reaches the
        # bundle. That guard has one weakness and it is the weakness every
        # spec-level check has: it runs INSIDE the build. Comment out the call,
        # break the import, or meet a PyInstaller whose `Analysis` no longer
        # exposes what it reads, and the build succeeds silently with the file
        # inside it.
        #
        # This reads the finished artefact instead -- different input,
        # different moment, so the two can only fail together if both are
        # removed on purpose. `--require-toc` because this runner has just run
        # PyInstaller: an unreadable PyInstaller archive here is a broken
        # check, not a clean bundle, and it must not be reported as a pass.
        shell: bash
        run: python scripts/exe_licence_check.py "$EXE" --require-toc

      - name: Write a SHA-256 sidecar for the exe
        # In the checksum, not the path: `sha256sum -c` fails outright if the
        # recorded name does not sit next to it, and whoever downloads this
        # only gets the two files, never the `dist/` folder they came from.
        shell: bash
        run: |
          cd dist && sha256sum "$(basename "$EXE")" > "$(basename "$EXE").sha256"

      - name: Attest build provenance for the exe
        # Ties the published exe back to this exact workflow run (source
        # commit, workflow file, inputs) via a Sigstore-signed attestation,
        # so "I downloaded this from the GitHub release" becomes something a
        # user can verify instead of something they have to take on faith.
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: ${{ env.EXE }}

      - name: Hand the executable to the release job
        uses: actions/upload-artifact@v4
        with:
          name: fpx-converter-exe
          # Both files: the sidecar has to travel with the exe it checksums,
          # or the release job would have an exe with nothing to verify it.
          path: |
            ${{ env.EXE }}
            ${{ env.EXE }}.sha256
          if-no-files-found: error
          retention-days: 1
