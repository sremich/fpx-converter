[project]
name = "fpx-converter"
description = "Batch-converts Kodak FlashPix (.fpx) photos to archival TIFF and shareable JPEG, preserving every recoverable property."
requires-python = ">=3.14"
dynamic = ["version"]

# The version lives ONLY in the VERSION file. Nothing here duplicates it --
# it is declared dynamic and read from that file, so there is exactly one
# place to bump and CI's tag check has one thing to compare against.
[tool.setuptools.dynamic]
version = { file = ["VERSION"] }

[tool.setuptools]
# The desktop front end is a package of its own beside the converter, not a
# module inside it: `fpx_converter` must stay installable and runnable with no
# GUI toolkit anywhere near it. PySide6 is in requirements-gui.txt only.
packages = ["fpx_converter", "fpx_gui"]

[tool.setuptools.package-data]
# The stylesheet is read through importlib.resources, so it has to travel with
# the package rather than being found next to a source file.
fpx_gui = ["*.qss"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The package is imported from the repo root rather than installed, so tests
# run against the working tree with no editable-install step in CI.
pythonpath = ["."]
addopts = "-q --strict-markers"
markers = [
  "fixtures: tier-2 tests that need the committed non-personal FPX fixtures",
  "corpus: tier-3/4 tests that need the real source archive (never run in CI)",
]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
