[project]
name = "fpx-converter"
description = "Batch-converts Kodak FlashPix (.fpx) photos to archival TIFF and shareable JPEG, preserving every recoverable property."
readme = "README.md"
requires-python = ">=3.14"
dynamic = ["version"]

# PEP 639: an SPDX expression plus the files that back it. `license-files`
# names LICENSE and the LGPL/GPL texts the packaged desktop app has to carry
# -- see THIRD-PARTY-NOTICES.md. Note that a `License ::` trove classifier is
# deliberately absent: PEP 639 makes it an error to give both, and the SPDX
# expression is the machine-readable one.
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE", "LICENSES/*.txt"]

authors = [{ name = "Stevie Remich" }]

keywords = ["flashpix", "fpx", "kodak", "exif", "xmp", "tiff", "photo-archive"]

classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: Console",
  "Environment :: Win32 (MS Windows)",
  "Intended Audience :: End Users/Desktop",
  "Natural Language :: English",
  "Operating System :: Microsoft :: Windows :: Windows 11",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Multimedia :: Graphics :: Graphics Conversion",
  "Topic :: System :: Archiving",
  "Topic :: Utilities",
]

# No email address is published for this project. Every contact route below is
# a GitHub URL on purpose; see SECURITY.md and CONTRIBUTING.md.
[project.urls]
Homepage = "https://github.com/sremich/fpx-converter"
Repository = "https://github.com/sremich/fpx-converter"
Issues = "https://github.com/sremich/fpx-converter/issues"
Changelog = "https://github.com/sremich/fpx-converter/blob/main/CHANGELOG.md"

# The version lives ONLY in the VERSION file. Nothing here duplicates it --
# it is declared dynamic and read from that file, so there is exactly one
# place to bump and CI's tag check has one thing to compare against.
[tool.setuptools.dynamic]
version = { file = ["VERSION"] }

[tool.setuptools]
# The desktop front end is a package of its own beside the converter, not a
# module inside it: `fpx_converter` must stay installable and runnable with no
# GUI toolkit anywhere near it. PySide6 is in requirements-gui.txt only.
packages = ["fpx_converter", "fpx_gui"]

[tool.setuptools.package-data]
# The stylesheet is read through importlib.resources, so it has to travel with
# the package rather than being found next to a source file.
fpx_gui = ["*.qss"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The package is imported from the repo root rather than installed, so tests
# run against the working tree with no editable-install step in CI.
pythonpath = ["."]
addopts = "-q --strict-markers"
markers = [
  "fixtures: tier-2 tests that need the committed non-personal FPX fixtures",
  "corpus: tier-3/4 tests that need the real source archive (never run in CI)",
]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
